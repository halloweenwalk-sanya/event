<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>参加者ステータス編集 | 山谷ハロウィンウォーク</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #1a202c; color: #f7fafc; margin: 0; padding: 10px; line-height: 1.4; padding-bottom: 64px; }
    .container { max-width: 480px; margin: 0 auto; }
    .card { background: #2d3748; padding: 14px 10px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.84rem; background: #1f2937; padding: 9px 10px; border-radius: 8px; }
    .back-link { color: #fbd38d; text-decoration: none; border: 1px solid #718096; border-radius: 6px; padding: 4px 9px; font-size: 0.78rem; font-weight: bold; }

    h1 { margin: 0 0 4px; color: #ff9800; font-size: 1.15rem; text-align: center; }
    .sub-title { text-align: center; font-size: 0.78rem; color: #cbd5e0; margin-bottom: 10px; }
    h2.sec-title {
      margin: 0 0 10px;
      color: #fbd38d;
      font-size: 0.96rem;
      border-bottom: 1px solid #4a5568;
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin: 4px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #4a5568;
    }
    .list-header-left {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .list-title {
      color: #fbd38d;
      font-size: 0.96rem;
      font-weight: bold;
    }
    .list-count {
      font-size: 0.8rem;
      color: #ff9800;
      font-weight: bold;
    }

    label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: #cbd5e0; }
    .search-input, .auth-input {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #4a5568;
      background: #1f2937;
      color: #fff;
      font-size: 0.9rem;
    }
    .note { font-size: 0.74rem; color: #a0aec0; margin-bottom: 8px; }

    .btn { width: 100%; padding: 12px; background: #ff7a00; color: #fff; border: none; border-radius: 8px; font-size: 0.94rem; font-weight: bold; cursor: pointer; display: block; text-align: center; text-decoration: none; margin-bottom: 8px; }
    .btn:last-child { margin-bottom: 0; }
    .btn:disabled { background: #718096; cursor: not-allowed; }

    .btn-edit-single {
      background: #ff7a00;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit-single.saving-mode {
      background: #2f855a;
    }
    .btn-edit-single:disabled {
      background: #718096;
      cursor: not-allowed;
    }
    .btn-cancel-mini {
      background: none;
      border: 1px solid #718096;
      color: #cbd5e0;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
    .filter-chip { padding: 7px 2px; border-radius: 8px; border: 1px solid #4a5568; background: #1f2937; color: #cbd5e0; font-size: 0.76rem; font-weight: bold; cursor: pointer; text-align: center; }
    .filter-chip.active { background: #ff7a00; color: #fff; border-color: #ff9800; }

    .sheet-wrap {
      width: 100%;
      max-height: 62vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #4a5568;
      border-radius: 8px;
      background: #1f2937;
    }

    table.sheet-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.75rem;
    }

    /* お菓子スポット・所属グループ・準備お菓子数をさらにコンパクト幅に設定 */
    col.c-no    { width: 24px; }
    col.c-addr  { width: 62px; }
    col.c-type  { width: 54px; }
    col.c-spot  { width: 40px; }
    col.c-group { width: 40px; }
    col.c-candy { width: 40px; }

    table.sheet-table thead th {
      background: #111827;
      color: #fbd38d;
      font-weight: bold;
      text-align: center;
      padding: 6px 1px;
      line-height: 1.15;
      font-size: 0.62rem;
      border-bottom: 1px solid #4a5568;
      border-right: 1px solid #374151;
      position: sticky;
      top: 0;
      z-index: 3;
      cursor: pointer;
      user-select: none;
      word-break: keep-all;
    }

    table.sheet-table thead th:hover {
      background: #1e293b;
    }

    table.sheet-table thead th:last-child {
      border-right: none;
    }

    .sort-ind {
      display: inline-block;
      margin-left: 1px;
      font-size: 0.58rem;
      color: #ff9800;
    }

    table.sheet-table tbody td {
      padding: 6px 1px;
      color: #f7fafc;
      border-bottom: 1px solid #374151;
      border-right: 1px solid #374151;
      vertical-align: middle;
      background: #1f2937;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    table.sheet-table tbody td:last-child {
      border-right: none;
    }

    table.sheet-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.sheet-table tbody tr:nth-child(even) td {
      background: #232d3d;
    }

    table.sheet-table th.col-no,
    table.sheet-table td.col-no {
      position: sticky;
      left: 0;
      z-index: 2;
      color: #9ca3af;
      font-weight: bold;
      padding-left: 1px;
      padding-right: 1px;
    }

    table.sheet-table thead th.col-no {
      background: #111827;
      color: #fbd38d;
      z-index: 4;
    }

    table.sheet-table th.col-addr,
    table.sheet-table td.col-addr {
      position: sticky;
      left: 24px;
      z-index: 2;
      font-weight: bold;
      color: #fbd38d;
      border-right: 1px solid #4a5568;
      text-align: left;
      padding-left: 4px;
      padding-right: 2px;
    }

    table.sheet-table thead th.col-addr {
      background: #111827;
      z-index: 4;
      text-align: center;
    }

    table.sheet-table.editing-active tbody td {
      padding: 3px 1px;
      background: #252f40;
      overflow: visible;
    }

    table.sheet-table.editing-active tbody tr.row-modified td {
      background: #2f261b;
    }

    .cell-input, .cell-select {
      width: 100%;
      padding: 5px 1px;
      border-radius: 4px;
      border: 1px solid #64748b;
      background: #111827;
      color: #fff;
      font-size: 0.7rem;
      margin: 0;
    }

    .cell-input:focus, .cell-select:focus {
      outline: none;
      border-color: #ff9800;
      background: #1a202c;
    }

    .combo-wrap {
      display: flex;
      align-items: stretch;
      width: 100%;
      background: #111827;
      border: 1px solid #64748b;
      border-radius: 4px;
      overflow: hidden;
    }
    .combo-wrap:focus-within {
      border-color: #ff9800;
    }
    .combo-wrap input {
      flex: 1;
      min-width: 0;
      width: 100%;
      border: none;
      background: transparent;
      color: #fff;
      padding: 5px 0 5px 1px;
      font-size: 0.7rem;
      margin: 0;
      text-align: center;
    }
    .combo-wrap input:focus {
      outline: none;
    }
    .combo-arrow {
      background: #1e293b;
      border: none;
      border-left: 1px solid #475569;
      color: #fbd38d;
      padding: 0 2px;
      font-size: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .combo-arrow:active {
      background: #ff7a00;
      color: #fff;
    }

    .combo-popup {
      position: fixed;
      z-index: 9999;
      background: #1e293b;
      border: 1.5px solid #ff9800;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.55);
      min-width: 76px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }
    .combo-popup.show {
      display: block;
    }
    .combo-option {
      padding: 8px 10px;
      font-size: 0.84rem;
      color: #f7fafc;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }
    .combo-option:last-child {
      border-bottom: none;
    }
    .combo-option:hover, .combo-option:active {
      background: #ff7a00;
      color: #fff;
    }

    .type-badge {
      display: inline-block;
      padding: 2px 3px;
      border-radius: 4px;
      font-size: 0.64rem;
      font-weight: bold;
    }
    .type-both { background: #7c2d12; color: #fed7aa; }
    .type-walk { background: #14532d; color: #bbf7d0; }
    .type-spot { background: #1e3a8a; color: #bfdbfe; }
    .type-absent { background: #7f1d1d; color: #fecaca; }

    .val-muted { color: #9ca3af; font-size: 0.68rem; }

    .req-candy-banner {
      background: #1f2937;
      border: 1.5px solid #ff9800;
      border-radius: 8px;
      padding: 9px 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .req-candy-label {
      font-size: 0.8rem;
      color: #e2e8f0;
      font-weight: bold;
    }
    .req-candy-sub {
      font-size: 0.7rem;
      color: #a0aec0;
      display: block;
      font-weight: normal;
    }
    .req-candy-val {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ff9800;
      white-space: nowrap;
    }

    .summary-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #4a5568;
      border-radius: 8px;
      background: #1f2937;
    }
    table.summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      white-space: nowrap;
    }
    table.summary-table th {
      background: #111827;
      color: #fbd38d;
      font-weight: bold;
      text-align: left;
      padding: 7px 6px;
      border-bottom: 1px solid #4a5568;
    }
    table.summary-table td {
      padding: 7px 6px;
      border-bottom: 1px solid #374151;
      color: #f7fafc;
    }
    table.summary-table tr:last-child td {
      border-bottom: none;
    }
    .diff-ok { color: #68d391; font-weight: bold; }
    .diff-short { color: #fc8181; font-weight: bold; }

    .toast { background: #22543d; border: 1px solid #48bb78; color: #c6f6d5; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
    .msg-error { color: #fc8181; font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>

<div id="comboPopup" class="combo-popup"></div>

<div class="container">
  <div class="header-bar">
    <span style="color:#fbd38d; font-weight:bold;">👥 参加者ステータス編集</span>
    <a href="./admin.html" class="back-link">← 管理画面へ戻る</a>
  </div>

  <div id="toastBox" class="toast"></div>

  <div id="authCard" class="card" style="display:none;">
    <h1>管理者認証</h1>
    <div class="sub-title">参加者ステータスの閲覧・編集には管理者パスワードが必要です</div>
    <label for="adminPassInput">管理者パスワード</label>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') unlockWithPassword()">
    <button id="unlockBtn" class="btn" onclick="unlockWithPassword()">認証して一覧を開く</button>
    <div id="authMsg" class="msg-error"></div>
  </div>

  <div id="mainSection" style="display:none;">
    <div class="card">
      <h1 id="pageEventName">参加者ステータス編集</h1>
      <div class="sub-title">受付期間にかかわらず下記5項目をいつでも編集できます</div>

      <input type="text" id="searchInput" class="search-input" placeholder="🔍 番地・グループで検索（例: 6004 / A）" oninput="onSearchOrFilterChange()">

      <div class="filter-row">
        <button type="button" class="filter-chip active" id="fltAll" onclick="setFilter('all')">すべて</button>
        <button type="button" class="filter-chip" id="fltUndecided" onclick="setFilter('undecided')">未定あり</button>
        <button type="button" class="filter-chip" id="fltSpot" onclick="setFilter('spot')">スポット</button>
        <button type="button" class="filter-chip" id="fltAbsent" onclick="setFilter('absent')">欠席</button>
      </div>

      <div class="list-header">
        <div class="list-header-left">
          <span class="list-title">登録世帯一覧</span>
          <span class="list-count" id="countLabel">0/0件</span>
        </div>
        <div style="display:flex; align-items:center; gap:5px;">
          <button type="button" id="cancelEditBtn" class="btn-cancel-mini" style="display:none;" onclick="cancelBulkEdit()">中止</button>
          <button type="button" id="toggleEditBtn" class="btn-edit-single" onclick="handleSingleEditButton()">編集</button>
        </div>
      </div>

      <div class="note" id="sheetHintNote">※見出しをタップすると並び替えできます。右上の「編集」で全セルを直接編集できます。</div>

      <div class="sheet-wrap">
        <table class="sheet-table" id="participantsTable">
          <colgroup>
            <col class="c-no">
            <col class="c-addr">
            <col class="c-type">
            <col class="c-spot">
            <col class="c-group">
            <col class="c-candy">
          </colgroup>
          <thead>
            <tr>
              <th class="col-no" onclick="toggleSort('no')">No<span class="sort-ind" id="sort_no">▲</span></th>
              <th class="col-addr" onclick="toggleSort('address')">番地<span class="sort-ind" id="sort_address"></span></th>
              <th onclick="toggleSort('type')">参加<br>形態<span class="sort-ind" id="sort_type"></span></th>
              <th onclick="toggleSort('candySpot')">お菓子<br>スポット<span class="sort-ind" id="sort_candySpot"></span></th>
              <th onclick="toggleSort('group')">所属<br>グループ<span class="sort-ind" id="sort_group"></span></th>
              <th onclick="toggleSort('candy')">準備<br>お菓子数<span class="sort-ind" id="sort_candy"></span></th>
            </tr>
          </thead>
          <tbody id="participantsTbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2 class="sec-title">
        <span>🍬 所属グループ毎の総準備お菓子数</span>
      </h2>

      <div class="req-candy-banner">
        <div class="req-candy-label">
          1スポットの必要お菓子数
          <span class="req-candy-sub">※子どもの総数（<span id="reqChildrenCount">0</span>人）＝1スポットで準備すべき総お菓子数</span>
        </div>
        <div class="req-candy-val"><span id="reqCandyPerSpot">0</span> 個</div>
      </div>

      <div class="summary-table-wrap">
        <table class="summary-table">
          <thead>
            <tr>
              <th>所属グループ</th>
              <th>世帯数</th>
              <th>総準備お菓子数</th>
              <th>必要数との差</th>
            </tr>
          </thead>
          <tbody id="groupSummaryTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw_f8vuCGQwmsg8N9CcItGBMe1YVWSkhCP5ubdoK8CM4xGxx8yk3RAgIJDBGNu4vI4C/exec';
  const ADMIN_HASH_SALT = 'hw_sanya_admin_salt_2027';

  const GROUP_OPTIONS = ['未定', '対象外', 'A', 'B', 'C', 'D', 'E'];
  const CANDY_OPTIONS = ['未定', '0', '10', '15', '20', '25', '30'];

  let cachedHash = '';
  let allParticipants = [];
  let summaryData = { households: 0, children: 0, totalSpots: 0 };
  let currentFilter = 'all';
  let isEditMode = false;
  let draftEdits = {};

  let sortState = { key: 'no', dir: 'asc' };
  let activeComboInput = null;

  window.onload = async function() {
    document.addEventListener('click', function(e) {
      const popup = document.getElementById('comboPopup');
      if (popup.classList.contains('show') && !popup.contains(e.target) && !e.target.classList.contains('combo-arrow')) {
        closeComboPopup();
      }
    });

    const saved =
      sessionStorage.getItem('hw_admin_hash') ||
      sessionStorage.getItem('hw_sanya_admin_hash_v1') ||
      '';

    if (/^[a-f0-9]{64}$/i.test(saved)) {
      cachedHash = saved.toLowerCase();
      const ok = await fetchParticipants();
      if (ok) return;
    }

    document.getElementById('authCard').style.display = 'block';
  };

  async function createAdminHash(pass) {
    const raw = `${String(pass).trim()}:${ADMIN_HASH_SALT}`;
    const msgUint8 = new TextEncoder().encode(raw);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function postGas(payload) {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('通信エラー: ' + text.replace(/<[^>]*>/g, '').slice(0, 80));
    }
  }

  async function unlockWithPassword() {
    const pass = document.getElementById('adminPassInput').value.trim();
    const msg = document.getElementById('authMsg');
    const btn = document.getElementById('unlockBtn');

    if (!pass) {
      msg.innerText = 'パスワードを入力してください。';
      return;
    }

    btn.disabled = true;
    msg.innerText = '認証中...';

    try {
      cachedHash = await createAdminHash(pass);
      const ok = await fetchParticipants();
      if (!ok) {
        cachedHash = '';
        btn.disabled = false;
        return;
      }
      sessionStorage.setItem('hw_admin_hash', cachedHash);
      sessionStorage.setItem('hw_sanya_admin_hash_v1', cachedHash);
    } catch (e) {
      msg.innerText = e.message;
      btn.disabled = false;
    }
  }

  function normalizeCandyText(rawVal) {
    if (rawVal === null || rawVal === undefined) return '未定';
    const str = String(rawVal)
      .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .trim();
    return str === '' ? '未定' : str;
  }

  function parseCandyNumber(rawVal) {
    if (typeof rawVal === 'number' && isFinite(rawVal) && rawVal >= 0) {
      return Math.floor(rawVal);
    }
    const str = normalizeCandyText(rawVal);
    if (!str || str === '未定' || str === '対象外') return null;
    const m = str.match(/-?\d+/);
    if (!m) return null;
    const n = parseInt(m[0], 10);
    return (!isNaN(n) && n >= 0) ? n : null;
  }

  function normalizeParticipantRow(p) {
    const rawCandy = (p.candy !== undefined)
      ? p.candy
      : (p.candyCount !== undefined ? p.candyCount : p.prepCandy);
    return Object.assign({}, p, {
      address: String(p.address || '').trim(),
      type: String(p.type || '').trim(),
      candySpot: String(p.candySpot || '未定').trim() || '未定',
      group: String(p.group || '未定').trim() || '未定',
      candy: normalizeCandyText(rawCandy)
    });
  }

  async function fetchParticipants() {
    const data = await postGas({ action: 'adminGetParticipants', passwordHash: cachedHash });
    if (!data || !data.success) {
      document.getElementById('authMsg').innerText = (data && data.message) || '認証に失敗しました。';
      return false;
    }

    document.getElementById('authCard').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    if (data.eventName) {
      document.getElementById('pageEventName').innerText = data.eventName + ' ステータス編集';
    }
    allParticipants = Array.isArray(data.participants)
      ? data.participants.map(normalizeParticipantRow)
      : [];
    if (data.summary) summaryData = data.summary;
    renderAll();
    return true;
  }

  function renderAll() {
    renderParticipants();
    renderGroupSummary();
  }

  function toggleSort(key) {
    closeComboPopup();
    if (isEditMode) {
      syncDraftInputsToMemory();
    }
    if (sortState.key === key) {
      sortState.dir = (sortState.dir === 'asc') ? 'desc' : 'asc';
    } else {
      sortState.key = key;
      sortState.dir = 'asc';
    }
    updateSortIndicators();
    renderParticipants();
  }

  function updateSortIndicators() {
    const keys = ['no', 'address', 'type', 'candySpot', 'group', 'candy'];
    keys.forEach(k => {
      const el = document.getElementById('sort_' + k);
      if (!el) return;
      if (sortState.key === k) {
        el.textContent = sortState.dir === 'asc' ? '▲' : '▼';
      } else {
        el.textContent = '';
      }
    });
  }

  function compareAddressNatural(a, b) {
    const pa = String(a || '').split('-').map(n => parseInt(n, 10));
    const pb = String(b || '').split('-').map(n => parseInt(n, 10));
    const mainA = isNaN(pa[0]) ? 0 : pa[0];
    const mainB = isNaN(pb[0]) ? 0 : pb[0];
    if (mainA !== mainB) return mainA - mainB;
    const subA = isNaN(pa[1]) ? -1 : pa[1];
    const subB = isNaN(pb[1]) ? -1 : pb[1];
    return subA - subB;
  }

  function compareCandyValue(a, b) {
    const na = parseCandyNumber(a);
    const nb = parseCandyNumber(b);
    if (na !== null && nb !== null) return na - nb;
    if (na !== null && nb === null) return -1;
    if (na === null && nb !== null) return 1;
    return String(a || '').localeCompare(String(b || ''), 'ja');
  }

  function sortItems(items) {
    const dirMul = sortState.dir === 'asc' ? 1 : -1;
    const key = sortState.key;

    return items.slice().sort((itemA, itemB) => {
      const a = itemA.cur;
      const b = itemB.cur;
      let cmp = 0;

      if (key === 'no') {
        cmp = (itemA.orig.rowNumber || 0) - (itemB.orig.rowNumber || 0);
      } else if (key === 'address') {
        cmp = compareAddressNatural(a.address, b.address);
      } else if (key === 'candy') {
        cmp = compareCandyValue(a.candy, b.candy);
      } else {
        cmp = String(a[key] || '').localeCompare(String(b[key] || ''), 'ja');
      }

      if (cmp === 0) {
        cmp = (itemA.orig.rowNumber || 0) - (itemB.orig.rowNumber || 0);
      }
      return cmp * dirMul;
    });
  }

  function onSearchOrFilterChange() {
    closeComboPopup();
    if (isEditMode) {
      syncDraftInputsToMemory();
    }
    renderParticipants();
  }

  function setFilter(mode) {
    closeComboPopup();
    if (isEditMode) {
      syncDraftInputsToMemory();
    }
    currentFilter = mode;
    document.getElementById('fltAll').classList.toggle('active', mode === 'all');
    document.getElementById('fltUndecided').classList.toggle('active', mode === 'undecided');
    document.getElementById('fltSpot').classList.toggle('active', mode === 'spot');
    document.getElementById('fltAbsent').classList.toggle('active', mode === 'absent');
    renderParticipants();
  }

  function getItemKey(p) {
    return p.token || ('row_' + p.rowNumber);
  }

  function openComboPopup(arrowBtn, listType) {
    const popup = document.getElementById('comboPopup');
    const wrap = arrowBtn.closest('.combo-wrap');
    const input = wrap ? wrap.querySelector('input') : null;
    if (!input) return;

    if (popup.classList.contains('show') && activeComboInput === input) {
      closeComboPopup();
      return;
    }

    activeComboInput = input;
    const options = (listType === 'candy') ? CANDY_OPTIONS : GROUP_OPTIONS;
    popup.innerHTML = options.map(opt =>
      `<div class="combo-option" onclick="selectComboOption('${escapeHtml(opt)}')">${escapeHtml(opt)}</div>`
    ).join('');

    const rect = wrap.getBoundingClientRect();
    popup.style.minWidth = Math.max(rect.width, 68) + 'px';
    popup.style.left = Math.min(rect.left, window.innerWidth - 84) + 'px';

    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < 180 && rect.top > 180) {
      popup.style.top = 'auto';
      popup.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
    } else {
      popup.style.bottom = 'auto';
      popup.style.top = (rect.bottom + 4) + 'px';
    }

    popup.classList.add('show');
  }

  function selectComboOption(val) {
    if (activeComboInput) {
      activeComboInput.value = val;
      activeComboInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
    closeComboPopup();
  }

  function closeComboPopup() {
    const popup = document.getElementById('comboPopup');
    popup.classList.remove('show');
    activeComboInput = null;
  }

  function syncDraftInputsToMemory() {
    const rows = document.querySelectorAll('#participantsTbody tr[data-key]');
    rows.forEach(tr => {
      const key = tr.getAttribute('data-key');
      const addrEl = tr.querySelector('.inp-addr');
      const typeEl = tr.querySelector('.inp-type');
      const spotEl = tr.querySelector('.inp-spot');
      const groupEl = tr.querySelector('.inp-group');
      const candyEl = tr.querySelector('.inp-candy');
      if (addrEl && typeEl && spotEl && groupEl && candyEl) {
        draftEdits[key] = {
          address: addrEl.value.trim(),
          type: typeEl.value,
          candySpot: spotEl.value.trim() || '未定',
          group: groupEl.value.trim() || '未定',
          candy: normalizeCandyText(candyEl.value)
        };
      }
    });
  }

  function onCellInputChanged(key) {
    const tr = document.querySelector(`#participantsTbody tr[data-key="${CSS.escape(key)}"]`);
    const orig = allParticipants.find(p => getItemKey(p) === key);
    if (!tr || !orig) return;

    const addr = tr.querySelector('.inp-addr').value.trim();
    const type = tr.querySelector('.inp-type').value;
    const spot = tr.querySelector('.inp-spot').value.trim() || '未定';
    const group = tr.querySelector('.inp-group').value.trim() || '未定';
    const candy = normalizeCandyText(tr.querySelector('.inp-candy').value);

    draftEdits[key] = { address: addr, type: type, candySpot: spot, group: group, candy: candy };

    const modified =
      addr !== orig.address ||
      type !== orig.type ||
      spot !== (orig.candySpot || '未定') ||
      group !== (orig.group || '未定') ||
      candy !== (orig.candy || '未定');

    tr.classList.toggle('row-modified', modified);
    renderGroupSummary();
  }

  function updateEditButtonUI() {
    const btn = document.getElementById('toggleEditBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    const table = document.getElementById('participantsTable');
    const hint = document.getElementById('sheetHintNote');

    if (isEditMode) {
      btn.textContent = '保存する';
      btn.classList.add('saving-mode');
      cancelBtn.style.display = 'inline-block';
      table.classList.add('editing-active');
      hint.textContent = '✏️ 編集中：▼ボタンで候補リストを開けます。完了したら「保存する」を押してください。';
    } else {
      btn.textContent = '編集';
      btn.classList.remove('saving-mode');
      cancelBtn.style.display = 'none';
      table.classList.remove('editing-active');
      hint.textContent = '※見出しをタップすると並び替えできます。右上の「編集」で全セルを直接編集できます。';
    }
  }

  async function handleSingleEditButton() {
    closeComboPopup();
    if (!isEditMode) {
      if (allParticipants.length === 0) return;
      isEditMode = true;
      draftEdits = {};
      allParticipants.forEach(p => {
        draftEdits[getItemKey(p)] = {
          address: p.address,
          type: p.type,
          candySpot: p.candySpot,
          group: p.group,
          candy: p.candy
        };
      });
      updateEditButtonUI();
      renderAll();
      return;
    }

    syncDraftInputsToMemory();

    const changedList = [];
    for (let i = 0; i < allParticipants.length; i++) {
      const orig = allParticipants[i];
      const key = getItemKey(orig);
      const d = draftEdits[key];
      if (!d) continue;

      if (!d.address) {
        alert(`No.${orig.rowNumber - 1}（元の番地：${orig.address}）の番地が空欄になっています。入力してください。`);
        return;
      }

      const isModified =
        d.address !== orig.address ||
        d.type !== orig.type ||
        (d.candySpot || '未定') !== (orig.candySpot || '未定') ||
        (d.group || '未定') !== (orig.group || '未定') ||
        (d.candy || '未定') !== (orig.candy || '未定');

      if (isModified) {
        changedList.push({ orig: orig, draft: d });
      }
    }

    if (changedList.length === 0) {
      isEditMode = false;
      draftEdits = {};
      updateEditButtonUI();
      renderAll();
      showToast('変更はありませんでした。');
      return;
    }

    const btn = document.getElementById('toggleEditBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    btn.disabled = true;
    cancelBtn.disabled = true;
    btn.textContent = '保存中...';

    try {
      let latestParticipants = allParticipants;
      let latestSummary = summaryData;
      for (let i = 0; i < changedList.length; i++) {
        const item = changedList[i];
        const data = await postGas({
          action: 'adminUpdateParticipant',
          passwordHash: cachedHash,
          token: item.orig.token,
          rowNumber: item.orig.rowNumber,
          address: item.draft.address,
          type: item.draft.type,
          candySpot: item.draft.candySpot || '未定',
          group: item.draft.group || '未定',
          candy: item.draft.candy || '未定'
        });

        if (!data || !data.success) {
          alert(`番地「${item.draft.address}」の保存に失敗しました: ${(data && data.message) || 'エラー'}`);
          btn.disabled = false;
          cancelBtn.disabled = false;
          updateEditButtonUI();
          return;
        }
        if (Array.isArray(data.participants)) {
          latestParticipants = data.participants.map(normalizeParticipantRow);
        }
        if (data.summary) {
          latestSummary = data.summary;
        }
      }

      allParticipants = latestParticipants;
      summaryData = latestSummary;
      isEditMode = false;
      draftEdits = {};
      btn.disabled = false;
      cancelBtn.disabled = false;
      updateEditButtonUI();
      renderAll();
      showToast(`${changedList.length}件のステータスを更新しました。`);
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
      cancelBtn.disabled = false;
      updateEditButtonUI();
    }
  }

  function cancelBulkEdit() {
    closeComboPopup();
    isEditMode = false;
    draftEdits = {};
    updateEditButtonUI();
    renderAll();
  }

  function formatTypeBadge(typeStr) {
    const t = String(typeStr || '');
    if (t.includes('欠席')) {
      return '<span class="type-badge type-absent">欠席</span>';
    }
    if (t.includes('両方')) {
      return '<span class="type-badge type-both">両方</span>';
    }
    if (t.includes('スポット')) {
      return '<span class="type-badge type-spot">スポット</span>';
    }
    if (t.includes('散策')) {
      return '<span class="type-badge type-walk">散策</span>';
    }
    return escapeHtml(t);
  }

  function formatCellVal(val) {
    const v = String(val || '').trim();
    if (!v || v === '未定' || v === '対象外') {
      return `<span class="val-muted">${escapeHtml(v || '未定')}</span>`;
    }
    return escapeHtml(v);
  }

  function renderParticipants() {
    const tbody = document.getElementById('participantsTbody');
    const kw = String(document.getElementById('searchInput').value || '').trim().toLowerCase();

    const mapped = allParticipants.map((p, idx) => {
      const key = getItemKey(p);
      const cur = (isEditMode && draftEdits[key]) ? draftEdits[key] : p;
      const rowNo = (p.rowNumber && p.rowNumber >= 2) ? (p.rowNumber - 1) : (idx + 1);
      return { orig: p, cur: cur, key: key, rowNo: rowNo };
    });

    const filtered = mapped.filter(item => {
      const cur = item.cur;
      if (currentFilter === 'undecided') {
        if (cur.candySpot !== '未定' && cur.group !== '未定' && cur.candy !== '未定') return false;
      } else if (currentFilter === 'spot') {
        if (!String(cur.type).includes('両方') && !String(cur.type).includes('スポット')) return false;
      } else if (currentFilter === 'absent') {
        if (!String(cur.type).includes('欠席')) return false;
      }

      if (!kw) return true;
      const text = `${item.rowNo} ${cur.address} ${cur.type} ${cur.candySpot} ${cur.group} ${cur.candy}`.toLowerCase();
      return text.includes(kw);
    });

    const sorted = sortItems(filtered);
    document.getElementById('countLabel').innerText = `${sorted.length}/${allParticipants.length}件`;

    if (sorted.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px; color:#a0aec0;">該当するデータがありません。</td></tr>`;
      return;
    }

    const typeChoices = [
      { value: '両方（散策＋スポット協力）', label: '両方' },
      { value: '散策のみ', label: '散策' },
      { value: 'スポットのみ', label: 'スポット' },
      { value: '欠席', label: '欠席' }
    ];

    tbody.innerHTML = sorted.map(item => {
      const p = item.orig;
      const cur = item.cur;
      const key = item.key;

      if (isEditMode) {
        const isModified =
          cur.address !== p.address ||
          cur.type !== p.type ||
          (cur.candySpot || '未定') !== (p.candySpot || '未定') ||
          (cur.group || '未定') !== (p.group || '未定') ||
          (cur.candy || '未定') !== (p.candy || '未定');

        const typeOpts = typeChoices.map(tc =>
          `<option value="${escapeHtml(tc.value)}" ${cur.type === tc.value ? 'selected' : ''}>${escapeHtml(tc.label)}</option>`
        ).join('');

        return `
          <tr data-key="${escapeHtml(key)}" class="${isModified ? 'row-modified' : ''}">
            <td class="col-no">${item.rowNo}</td>
            <td class="col-addr">
              <input type="text" class="cell-input inp-addr" value="${escapeHtml(cur.address)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
            </td>
            <td>
              <select class="cell-select inp-type" onchange="onCellInputChanged('${escapeHtml(key)}')">${typeOpts}</select>
            </td>
            <td>
              <div class="combo-wrap">
                <input type="text" class="inp-spot" value="${escapeHtml(cur.candySpot)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
                <button type="button" class="combo-arrow" onclick="openComboPopup(this, 'group')">▼</button>
              </div>
            </td>
            <td>
              <div class="combo-wrap">
                <input type="text" class="inp-group" value="${escapeHtml(cur.group)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
                <button type="button" class="combo-arrow" onclick="openComboPopup(this, 'group')">▼</button>
              </div>
            </td>
            <td>
              <div class="combo-wrap">
                <input type="text" class="inp-candy" value="${escapeHtml(cur.candy)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
                <button type="button" class="combo-arrow" onclick="openComboPopup(this, 'candy')">▼</button>
              </div>
            </td>
          </tr>
        `;
      }

      return `
        <tr>
          <td class="col-no">${item.rowNo}</td>
          <td class="col-addr">${escapeHtml(cur.address)}</td>
          <td>${formatTypeBadge(cur.type)}</td>
          <td>${formatCellVal(cur.candySpot)}</td>
          <td>${formatCellVal(cur.group)}</td>
          <td>${formatCellVal(cur.candy)}</td>
        </tr>
      `;
    }).join('');
  }

  function renderGroupSummary() {
    const requiredPerSpot = Number(summaryData.children) || 0;
    document.getElementById('reqChildrenCount').innerText = requiredPerSpot;
    document.getElementById('reqCandyPerSpot').innerText = requiredPerSpot;

    const tbody = document.getElementById('groupSummaryTbody');
    const groupMap = {};

    allParticipants.forEach(p => {
      const key = getItemKey(p);
      const cur = (isEditMode && draftEdits[key]) ? draftEdits[key] : p;
      const typeStr = String(cur.type || '');
      if (typeStr.includes('欠席')) return;

      const grp = String(cur.group || '未定').trim() || '未定';
      if (grp === '対象外') return;

      if (!groupMap[grp]) {
        groupMap[grp] = { group: grp, households: 0, totalCandy: 0, undecidedCount: 0 };
      }
      groupMap[grp].households += 1;

      const numCandy = parseCandyNumber(cur.candy);
      if (numCandy !== null) {
        groupMap[grp].totalCandy += numCandy;
      } else {
        groupMap[grp].undecidedCount += 1;
      }
    });

    const groups = Object.values(groupMap).sort((a, b) => {
      if (a.group === '未定') return 1;
      if (b.group === '未定') return -1;
      return a.group.localeCompare(b.group, 'ja');
    });

    if (groups.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:14px; color:#a0aec0;">集計対象の所属グループがありません。</td></tr>`;
      return;
    }

    tbody.innerHTML = groups.map(g => {
      const diff = g.totalCandy - requiredPerSpot;
      const diffText = diff >= 0 ? `+${diff} 個` : `${diff} 個`;
      const diffClass = diff >= 0 ? 'diff-ok' : 'diff-short';
      const undecidedNote = g.undecidedCount > 0 ? ` <span class="val-muted">(未定${g.undecidedCount}件)</span>` : '';

      return `
        <tr>
          <td><strong>${escapeHtml(g.group)}</strong></td>
          <td>${g.households} 世帯</td>
          <td><strong>${g.totalCandy} 個</strong>${undecidedNote}</td>
          <td class="${diffClass}">${diffText}</td>
        </tr>
      `;
    }).join('');
  }

  function showToast(text) {
    const box = document.getElementById('toastBox');
    box.innerText = '✅ ' + text;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 4500);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
