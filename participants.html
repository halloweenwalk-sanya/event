<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>参加者ステータス編集 | 山谷ハロウィンウォーク</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #1a202c; color: #f7fafc; margin: 0; padding: 12px; line-height: 1.45; padding-bottom: 48px; }
    .container { max-width: 720px; margin: 0 auto; }
    .card { background: #2d3748; padding: 16px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; background: #1f2937; padding: 10px 12px; border-radius: 8px; }
    .back-link { color: #fbd38d; text-decoration: none; border: 1px solid #718096; border-radius: 6px; padding: 5px 10px; font-size: 0.8rem; font-weight: bold; }

    h1 { margin: 0 0 4px; color: #ff9800; font-size: 1.2rem; text-align: center; }
    .sub-title { text-align: center; font-size: 0.82rem; color: #cbd5e0; margin-bottom: 12px; }
    h2 { margin: 0 0 10px; color: #fbd38d; font-size: 1rem; border-bottom: 1px solid #4a5568; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

    label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: #e2e8f0; }
    input, select { width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #4a5568; background: #1f2937; color: #fff; font-size: 0.92rem; }
    .note { font-size: 0.78rem; color: #a0aec0; margin-bottom: 8px; }

    .btn { width: 100%; padding: 12px; background: #ff7a00; color: #fff; border: none; border-radius: 8px; font-size: 0.92rem; font-weight: bold; cursor: pointer; display: block; text-align: center; text-decoration: none; margin-bottom: 8px; }
    .btn:last-child { margin-bottom: 0; }
    .btn:disabled { background: #718096; cursor: not-allowed; }
    .btn-sub { background: #4a5568; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-row .btn { margin-bottom: 0; }

    .filter-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .filter-chip { padding: 8px 4px; border-radius: 8px; border: 1px solid #4a5568; background: #1f2937; color: #cbd5e0; font-size: 0.78rem; font-weight: bold; cursor: pointer; text-align: center; }
    .filter-chip.active { background: #ff7a00; color: #fff; border-color: #ff9800; }

    /* 編集フォームパネル（選択行の編集用） */
    .edit-panel {
      background: #1f2937;
      border: 2px solid #ff9800;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
    }
    .edit-panel.show { display: block; }
    .edit-panel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fbd38d;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #374151;
    }
    .edit-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 10px;
    }

    /* 一覧テーブル（1行1世帯・横スクロール＆左列固定対応） */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #4a5568;
      border-radius: 8px;
      background: #1f2937;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    thead th {
      background: #111827;
      color: #fbd38d;
      font-weight: bold;
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid #4a5568;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr {
      border-bottom: 1px solid #374151;
      cursor: pointer;
      transition: background 0.12s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #283548;
    }

    tbody tr.selected-row {
      background: #3b2d1f;
    }

    tbody td {
      padding: 9px 8px;
      color: #f7fafc;
      vertical-align: middle;
    }

    /* 1列目（住所）を左端固定して横スクロール時も識別しやすくする */
    th.col-addr, td.col-addr {
      position: sticky;
      left: 0;
      z-index: 1;
      background: inherit;
      font-weight: bold;
      color: #fbd38d;
      border-right: 1px solid #374151;
    }
    thead th.col-addr {
      background: #111827;
      z-index: 3;
    }
    tbody tr:not(.selected-row) td.col-addr {
      background: #1f2937;
    }
    tbody tr.selected-row td.col-addr {
      background: #3b2d1f;
    }

    .type-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.74rem;
      font-weight: bold;
    }
    .type-both { background: #7c2d12; color: #fed7aa; }
    .type-walk { background: #14532d; color: #bbf7d0; }
    .type-spot { background: #1e3a8a; color: #bfdbfe; }
    .type-absent { background: #7f1d1d; color: #fecaca; }

    .val-muted { color: #9ca3af; }
    .edit-tag {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid #718096;
      border-radius: 5px;
      font-size: 0.72rem;
      color: #cbd5e0;
    }

    .toast { background: #22543d; border: 1px solid #48bb78; color: #c6f6d5; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
    .msg-error { color: #fc8181; font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span style="color:#fbd38d; font-weight:bold;">👥 参加者ステータス編集</span>
    <a href="./admin.html" class="back-link">← 管理画面へ戻る</a>
  </div>

  <div id="toastBox" class="toast"></div>

  <!-- 認証フォーム（直接アクセス時のみ表示） -->
  <div id="authCard" class="card" style="display:none;">
    <h1>管理者認証</h1>
    <div class="sub-title">参加者ステータスの閲覧・編集には管理者パスワードが必要です</div>
    <label for="adminPassInput">管理者パスワード</label>
    <input type="password" id="adminPassInput" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') unlockWithPassword()">
    <button id="unlockBtn" class="btn" onclick="unlockWithPassword()">認証して一覧を開く</button>
    <div id="authMsg" class="msg-error"></div>
  </div>

  <!-- メイン一覧＆編集エリア -->
  <div id="mainSection" style="display:none;">
    <div class="card">
      <h1 id="pageEventName">参加者ステータス編集</h1>
      <div class="sub-title">行をタップすると内容を編集できます（期間にかかわらず編集可能）</div>

      <!-- 選択中の世帯の編集パネル -->
      <div id="editPanel" class="edit-panel">
        <div class="edit-panel-title" id="editPanelTitle">✏️ ステータス編集</div>

        <div class="edit-grid-2">
          <div>
            <label for="editAddr">住所（番地）</label>
            <input type="text" id="editAddr" placeholder="例: 6004-10">
          </div>
          <div>
            <label for="editCandy">準備お菓子数</label>
            <input type="text" id="editCandy" list="candyPresetList" placeholder="例: 20 / 未定">
          </div>
        </div>

        <label for="editType">参加形態</label>
        <select id="editType">
          <option value="両方（散策＋スポット協力）">両方（散策＋スポット協力）</option>
          <option value="散策のみ">散策のみ</option>
          <option value="スポットのみ">スポットのみ</option>
          <option value="欠席">欠席</option>
        </select>

        <div class="edit-grid-2">
          <div>
            <label for="editSpot">お菓子スポット</label>
            <input type="text" id="editSpot" list="groupPresetList" placeholder="例: Aグループ">
          </div>
          <div>
            <label for="editGroup">所属グループ</label>
            <input type="text" id="editGroup" list="groupPresetList" placeholder="例: Bグループ">
          </div>
        </div>

        <div class="btn-row">
          <button type="button" id="saveBtn" class="btn" onclick="saveParticipant()">保存する</button>
          <button type="button" class="btn btn-sub" onclick="cancelEdit()">閉じる</button>
        </div>
      </div>

      <input type="text" id="searchInput" placeholder="🔍 住所・グループで検索（例: 6004 / Aグループ）" oninput="renderParticipants()">

      <div class="filter-row">
        <button type="button" class="filter-chip active" id="fltAll" onclick="setFilter('all')">すべて</button>
        <button type="button" class="filter-chip" id="fltUndecided" onclick="setFilter('undecided')">未定あり</button>
        <button type="button" class="filter-chip" id="fltSpot" onclick="setFilter('spot')">スポット</button>
        <button type="button" class="filter-chip" id="fltAbsent" onclick="setFilter('absent')">欠席</button>
      </div>

      <h2>
        <span>登録世帯一覧</span>
        <span style="font-size:0.8rem; color:#ff9800;" id="countLabel">0件</span>
      </h2>
      <div class="note">※行をタップして編集できます（横スクロール可）。</div>

      <datalist id="groupPresetList">
        <option value="未定">
        <option value="対象外">
        <option value="Aグループ">
        <option value="Bグループ">
        <option value="Cグループ">
        <option value="Dグループ">
        <option value="Eグループ">
      </datalist>

      <datalist id="candyPresetList">
        <option value="未定">
        <option value="0">
        <option value="10">
        <option value="15">
        <option value="20">
        <option value="25">
        <option value="30">
      </datalist>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-addr">住所</th>
              <th>参加形態</th>
              <th>お菓子スポット</th>
              <th>所属グループ</th>
              <th>準備お菓子数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="participantsTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw_f8vuCGQwmsg8N9CcItGBMe1YVWSkhCP5ubdoK8CM4xGxx8yk3RAgIJDBGNu4vI4C/exec';
  const ADMIN_HASH_SALT = 'hw_sanya_admin_salt_2027';

  let cachedHash = '';
  let allParticipants = [];
  let currentFilter = 'all';
  let editingKey = '';

  window.onload = async function() {
    const saved =
      sessionStorage.getItem('hw_admin_hash') ||
      sessionStorage.getItem('hw_sanya_admin_hash_v1') ||
      '';

    if (/^[a-f0-9]{64}$/i.test(saved)) {
      cachedHash = saved.toLowerCase();
      const ok = await fetchParticipants();
      if (ok) return;
    }

    document.getElementById('authCard').style.display = 'block';
  };

  async function createAdminHash(pass) {
    const raw = `${String(pass).trim()}:${ADMIN_HASH_SALT}`;
    const msgUint8 = new TextEncoder().encode(raw);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function postGas(payload) {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('通信エラー: ' + text.replace(/<[^>]*>/g, '').slice(0, 80));
    }
  }

  async function unlockWithPassword() {
    const pass = document.getElementById('adminPassInput').value.trim();
    const msg = document.getElementById('authMsg');
    const btn = document.getElementById('unlockBtn');

    if (!pass) {
      msg.innerText = 'パスワードを入力してください。';
      return;
    }

    btn.disabled = true;
    msg.innerText = '認証中...';

    try {
      cachedHash = await createAdminHash(pass);
      const ok = await fetchParticipants();
      if (!ok) {
        cachedHash = '';
        btn.disabled = false;
        return;
      }
      sessionStorage.setItem('hw_admin_hash', cachedHash);
      sessionStorage.setItem('hw_sanya_admin_hash_v1', cachedHash);
    } catch (e) {
      msg.innerText = e.message;
      btn.disabled = false;
    }
  }

  async function fetchParticipants() {
    const data = await postGas({ action: 'adminGetParticipants', passwordHash: cachedHash });
    if (!data || !data.success) {
      document.getElementById('authMsg').innerText = (data && data.message) || '認証に失敗しました。';
      return false;
    }

    document.getElementById('authCard').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    if (data.eventName) {
      document.getElementById('pageEventName').innerText = data.eventName + ' ステータス編集';
    }
    allParticipants = Array.isArray(data.participants) ? data.participants : [];
    renderParticipants();
    return true;
  }

  function setFilter(mode) {
    currentFilter = mode;
    document.getElementById('fltAll').classList.toggle('active', mode === 'all');
    document.getElementById('fltUndecided').classList.toggle('active', mode === 'undecided');
    document.getElementById('fltSpot').classList.toggle('active', mode === 'spot');
    document.getElementById('fltAbsent').classList.toggle('active', mode === 'absent');
    renderParticipants();
  }

  function getItemKey(p) {
    return p.token || ('row_' + p.rowNumber);
  }

  function formatTypeBadge(typeStr) {
    const t = String(typeStr || '');
    if (t.includes('欠席')) {
      return '<span class="type-badge type-absent">欠席</span>';
    }
    if (t.includes('両方')) {
      return '<span class="type-badge type-both">両方</span>';
    }
    if (t.includes('スポット')) {
      return '<span class="type-badge type-spot">スポットのみ</span>';
    }
    if (t.includes('散策')) {
      return '<span class="type-badge type-walk">散策のみ</span>';
    }
    return escapeHtml(t);
  }

  function formatCellVal(val) {
    const v = String(val || '').trim();
    if (!v || v === '未定' || v === '対象外') {
      return `<span class="val-muted">${escapeHtml(v || '未定')}</span>`;
    }
    return escapeHtml(v);
  }

  function renderParticipants() {
    const tbody = document.getElementById('participantsTbody');
    const kw = String(document.getElementById('searchInput').value || '').trim().toLowerCase();

    const list = allParticipants.filter(p => {
      if (currentFilter === 'undecided') {
        if (p.candySpot !== '未定' && p.group !== '未定' && p.candy !== '未定') return false;
      } else if (currentFilter === 'spot') {
        if (!String(p.type).includes('両方') && !String(p.type).includes('スポット')) return false;
      } else if (currentFilter === 'absent') {
        if (!String(p.type).includes('欠席')) return false;
      }

      if (!kw) return true;
      const text = `${p.address} ${p.type} ${p.candySpot} ${p.group} ${p.candy}`.toLowerCase();
      return text.includes(kw);
    });

    document.getElementById('countLabel').innerText = `${list.length} / ${allParticipants.length}件`;

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:18px; color:#a0aec0;">該当するデータがありません。</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(p => {
      const key = getItemKey(p);
      const isSelected = (editingKey === key);
      return `
        <tr class="${isSelected ? 'selected-row' : ''}" onclick="startEdit('${escapeHtml(key)}')">
          <td class="col-addr">${escapeHtml(p.address)}</td>
          <td>${formatTypeBadge(p.type)}</td>
          <td>${formatCellVal(p.candySpot)}</td>
          <td>${formatCellVal(p.group)}</td>
          <td>${formatCellVal(p.candy)}</td>
          <td><span class="edit-tag">編集</span></td>
        </tr>
      `;
    }).join('');
  }

  function startEdit(key) {
    const target = allParticipants.find(p => getItemKey(p) === key);
    if (!target) return;

    editingKey = key;
    document.getElementById('editPanelTitle').innerText = `✏️ 住所「${target.address}」のステータス編集`;
    document.getElementById('editAddr').value = target.address || '';
    document.getElementById('editType').value = target.type || '両方（散策＋スポット協力）';
    document.getElementById('editSpot').value = target.candySpot || '未定';
    document.getElementById('editGroup').value = target.group || '未定';
    document.getElementById('editCandy').value = target.candy || '未定';

    const panel = document.getElementById('editPanel');
    panel.classList.add('show');
    renderParticipants();
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function cancelEdit() {
    editingKey = '';
    document.getElementById('editPanel').classList.remove('show');
    renderParticipants();
  }

  async function saveParticipant() {
    if (!editingKey) return;
    const target = allParticipants.find(p => getItemKey(p) === editingKey);
    if (!target) return;

    const address = document.getElementById('editAddr').value.trim();
    const type = document.getElementById('editType').value;
    const candySpot = document.getElementById('editSpot').value.trim();
    const group = document.getElementById('editGroup').value.trim();
    const candy = document.getElementById('editCandy').value.trim();

    if (!address) {
      alert('住所（番地）を入力してください。');
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerText = '保存中...';

    try {
      const data = await postGas({
        action: 'adminUpdateParticipant',
        passwordHash: cachedHash,
        token: target.token,
        rowNumber: target.rowNumber,
        address: address,
        type: type,
        candySpot: candySpot,
        group: group,
        candy: candy
      });

      if (!data || !data.success) {
        alert((data && data.message) || '保存に失敗しました。');
        return;
      }

      editingKey = '';
      document.getElementById('editPanel').classList.remove('show');
      allParticipants = Array.isArray(data.participants) ? data.participants : [];
      renderParticipants();
      showToast(data.message);
    } catch (e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = '保存する';
    }
  }

  function showToast(text) {
    const box = document.getElementById('toastBox');
    box.innerText = '✅ ' + text;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 4500);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
