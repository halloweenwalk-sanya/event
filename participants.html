<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>参加者ステータス編集 | 山谷ハロウィンウォーク</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: #1a202c; color: #f7fafc; margin: 0; padding: 14px; line-height: 1.45; padding-bottom: 48px; }
    .container { max-width: 760px; margin: 0 auto; }
    .card { background: #2d3748; padding: 16px; border-radius: 12px; margin-bottom: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; background: #1f2937; padding: 10px 12px; border-radius: 8px; }
    .back-link { color: #fbd38d; text-decoration: none; border: 1px solid #718096; border-radius: 6px; padding: 5px 10px; font-size: 0.8rem; font-weight: bold; }

    h1 { margin: 0 0 4px; color: #ff9800; font-size: 1.2rem; text-align: center; }
    .sub-title { text-align: center; font-size: 0.82rem; color: #cbd5e0; margin-bottom: 12px; }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 4px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #4a5568;
    }
    .list-header-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .list-title {
      color: #fbd38d;
      font-size: 1.02rem;
      font-weight: bold;
    }
    .list-count {
      font-size: 0.82rem;
      color: #ff9800;
      font-weight: bold;
    }

    label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: #cbd5e0; }
    .search-input, .auth-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #4a5568;
      background: #1f2937;
      color: #fff;
      font-size: 0.92rem;
    }
    .note { font-size: 0.78rem; color: #a0aec0; margin-bottom: 8px; }

    .btn { width: 100%; padding: 12px; background: #ff7a00; color: #fff; border: none; border-radius: 8px; font-size: 0.94rem; font-weight: bold; cursor: pointer; display: block; text-align: center; text-decoration: none; margin-bottom: 8px; }
    .btn:last-child { margin-bottom: 0; }
    .btn:disabled { background: #718096; cursor: not-allowed; }

    /* ヘッダー右上の単一編集／保存ボタン */
    .btn-edit-single {
      background: #ff7a00;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 0.84rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit-single.saving-mode {
      background: #2f855a;
    }
    .btn-edit-single:disabled {
      background: #718096;
      cursor: not-allowed;
    }
    .btn-cancel-mini {
      background: none;
      border: 1px solid #718096;
      color: #cbd5e0;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 4種フィルターチップ */
    .filter-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .filter-chip { padding: 8px 4px; border-radius: 8px; border: 1px solid #4a5568; background: #1f2937; color: #cbd5e0; font-size: 0.78rem; font-weight: bold; cursor: pointer; text-align: center; }
    .filter-chip.active { background: #ff7a00; color: #fff; border-color: #ff9800; }

    /* スプレッドシート形式グリッドテーブル */
    .sheet-wrap {
      width: 100%;
      max-height: 68vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #4a5568;
      border-radius: 8px;
      background: #1f2937;
    }

    table.sheet-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    table.sheet-table thead th {
      background: #111827;
      color: #fbd38d;
      font-weight: bold;
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid #4a5568;
      border-right: 1px solid #374151;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    table.sheet-table thead th:last-child {
      border-right: none;
    }

    table.sheet-table tbody td {
      padding: 8px 10px;
      color: #f7fafc;
      border-bottom: 1px solid #374151;
      border-right: 1px solid #374151;
      vertical-align: middle;
      background: #1f2937;
    }

    table.sheet-table tbody td:last-child {
      border-right: none;
    }

    table.sheet-table tbody tr:last-child td {
      border-bottom: none;
    }

    table.sheet-table tbody tr:nth-child(even) td {
      background: #232d3d;
    }

    /* 1列目（番地）を左端固定 */
    table.sheet-table th.col-addr,
    table.sheet-table td.col-addr {
      position: sticky;
      left: 0;
      z-index: 2;
      font-weight: bold;
      color: #fbd38d;
      border-right: 1px solid #4a5568;
      min-width: 78px;
    }

    table.sheet-table thead th.col-addr {
      background: #111827;
      z-index: 4;
    }

    /* 編集モード時のセル内入力スタイル */
    table.sheet-table.editing-active tbody td {
      padding: 5px 6px;
      background: #252f40;
    }

    table.sheet-table.editing-active tbody tr.row-modified td {
      background: #2f261b;
    }

    .cell-input, .cell-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #64748b;
      background: #111827;
      color: #fff;
      font-size: 0.84rem;
      margin: 0;
    }

    .cell-input:focus, .cell-select:focus {
      outline: none;
      border-color: #ff9800;
      background: #1a202c;
    }

    .w-addr { min-width: 82px; }
    .w-type { min-width: 155px; }
    .w-spot { min-width: 112px; }
    .w-group { min-width: 112px; }
    .w-candy { min-width: 82px; }

    .type-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .type-both { background: #7c2d12; color: #fed7aa; }
    .type-walk { background: #14532d; color: #bbf7d0; }
    .type-spot { background: #1e3a8a; color: #bfdbfe; }
    .type-absent { background: #7f1d1d; color: #fecaca; }

    .val-muted { color: #9ca3af; }

    .toast { background: #22543d; border: 1px solid #48bb78; color: #c6f6d5; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
    .msg-error { color: #fc8181; font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <span style="color:#fbd38d; font-weight:bold;">👥 参加者ステータス編集</span>
    <a href="./admin.html" class="back-link">← 管理画面へ戻る</a>
  </div>

  <div id="toastBox" class="toast"></div>

  <!-- 認証フォーム（直接アクセス時のみ表示） -->
  <div id="authCard" class="card" style="display:none;">
    <h1>管理者認証</h1>
    <div class="sub-title">参加者ステータスの閲覧・編集には管理者パスワードが必要です</div>
    <label for="adminPassInput">管理者パスワード</label>
    <input type="password" id="adminPassInput" class="auth-input" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter') unlockWithPassword()">
    <button id="unlockBtn" class="btn" onclick="unlockWithPassword()">認証して一覧を開く</button>
    <div id="authMsg" class="msg-error"></div>
  </div>

  <!-- メイン一覧＆編集エリア -->
  <div id="mainSection" style="display:none;">
    <div class="card">
      <h1 id="pageEventName">参加者ステータス編集</h1>
      <div class="sub-title">受付期間にかかわらず下記5項目をいつでも編集できます</div>

      <input type="text" id="searchInput" class="search-input" placeholder="🔍 番地・グループで検索（例: 6004 / Aグループ）" oninput="onSearchOrFilterChange()">

      <div class="filter-row">
        <button type="button" class="filter-chip active" id="fltAll" onclick="setFilter('all')">すべて</button>
        <button type="button" class="filter-chip" id="fltUndecided" onclick="setFilter('undecided')">未定あり</button>
        <button type="button" class="filter-chip" id="fltSpot" onclick="setFilter('spot')">スポット</button>
        <button type="button" class="filter-chip" id="fltAbsent" onclick="setFilter('absent')">欠席</button>
      </div>

      <div class="list-header">
        <div class="list-header-left">
          <span class="list-title">登録世帯一覧</span>
          <span class="list-count" id="countLabel">0/0件</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button type="button" id="cancelEditBtn" class="btn-cancel-mini" style="display:none;" onclick="cancelBulkEdit()">中止</button>
          <button type="button" id="toggleEditBtn" class="btn-edit-single" onclick="handleSingleEditButton()">編集</button>
        </div>
      </div>

      <div class="note" id="sheetHintNote">※表は左右にスクロールできます。右上の「編集」で全セルを直接編集できます。</div>

      <datalist id="groupPresetList">
        <option value="未定">
        <option value="対象外">
        <option value="Aグループ">
        <option value="Bグループ">
        <option value="Cグループ">
        <option value="Dグループ">
        <option value="Eグループ">
      </datalist>

      <datalist id="candyPresetList">
        <option value="未定">
        <option value="0">
        <option value="10">
        <option value="15">
        <option value="20">
        <option value="25">
        <option value="30">
      </datalist>

      <div class="sheet-wrap">
        <table class="sheet-table" id="participantsTable">
          <thead>
            <tr>
              <th class="col-addr">番地</th>
              <th>参加形態</th>
              <th>お菓子スポット</th>
              <th>所属グループ</th>
              <th>準備お菓子数</th>
            </tr>
          </thead>
          <tbody id="participantsTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw_f8vuCGQwmsg8N9CcItGBMe1YVWSkhCP5ubdoK8CM4xGxx8yk3RAgIJDBGNu4vI4C/exec';
  const ADMIN_HASH_SALT = 'hw_sanya_admin_salt_2027';

  let cachedHash = '';
  let allParticipants = [];
  let currentFilter = 'all';
  let isEditMode = false;
  let draftEdits = {};

  window.onload = async function() {
    const saved =
      sessionStorage.getItem('hw_admin_hash') ||
      sessionStorage.getItem('hw_sanya_admin_hash_v1') ||
      '';

    if (/^[a-f0-9]{64}$/i.test(saved)) {
      cachedHash = saved.toLowerCase();
      const ok = await fetchParticipants();
      if (ok) return;
    }

    document.getElementById('authCard').style.display = 'block';
  };

  async function createAdminHash(pass) {
    const raw = `${String(pass).trim()}:${ADMIN_HASH_SALT}`;
    const msgUint8 = new TextEncoder().encode(raw);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function postGas(payload) {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('通信エラー: ' + text.replace(/<[^>]*>/g, '').slice(0, 80));
    }
  }

  async function unlockWithPassword() {
    const pass = document.getElementById('adminPassInput').value.trim();
    const msg = document.getElementById('authMsg');
    const btn = document.getElementById('unlockBtn');

    if (!pass) {
      msg.innerText = 'パスワードを入力してください。';
      return;
    }

    btn.disabled = true;
    msg.innerText = '認証中...';

    try {
      cachedHash = await createAdminHash(pass);
      const ok = await fetchParticipants();
      if (!ok) {
        cachedHash = '';
        btn.disabled = false;
        return;
      }
      sessionStorage.setItem('hw_admin_hash', cachedHash);
      sessionStorage.setItem('hw_sanya_admin_hash_v1', cachedHash);
    } catch (e) {
      msg.innerText = e.message;
      btn.disabled = false;
    }
  }

  async function fetchParticipants() {
    const data = await postGas({ action: 'adminGetParticipants', passwordHash: cachedHash });
    if (!data || !data.success) {
      document.getElementById('authMsg').innerText = (data && data.message) || '認証に失敗しました。';
      return false;
    }

    document.getElementById('authCard').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    if (data.eventName) {
      document.getElementById('pageEventName').innerText = data.eventName + ' ステータス編集';
    }
    allParticipants = Array.isArray(data.participants) ? data.participants : [];
    renderParticipants();
    return true;
  }

  function onSearchOrFilterChange() {
    if (isEditMode) {
      syncDraftInputsToMemory();
    }
    renderParticipants();
  }

  function setFilter(mode) {
    if (isEditMode) {
      syncDraftInputsToMemory();
    }
    currentFilter = mode;
    document.getElementById('fltAll').classList.toggle('active', mode === 'all');
    document.getElementById('fltUndecided').classList.toggle('active', mode === 'undecided');
    document.getElementById('fltSpot').classList.toggle('active', mode === 'spot');
    document.getElementById('fltAbsent').classList.toggle('active', mode === 'absent');
    renderParticipants();
  }

  function getItemKey(p) {
    return p.token || ('row_' + p.rowNumber);
  }

  function syncDraftInputsToMemory() {
    const rows = document.querySelectorAll('#participantsTbody tr[data-key]');
    rows.forEach(tr => {
      const key = tr.getAttribute('data-key');
      const addrEl = tr.querySelector('.inp-addr');
      const typeEl = tr.querySelector('.inp-type');
      const spotEl = tr.querySelector('.inp-spot');
      const groupEl = tr.querySelector('.inp-group');
      const candyEl = tr.querySelector('.inp-candy');
      if (addrEl && typeEl && spotEl && groupEl && candyEl) {
        draftEdits[key] = {
          address: addrEl.value.trim(),
          type: typeEl.value,
          candySpot: spotEl.value.trim(),
          group: groupEl.value.trim(),
          candy: candyEl.value.trim()
        };
      }
    });
  }

  function onCellInputChanged(key) {
    const tr = document.querySelector(`#participantsTbody tr[data-key="${CSS.escape(key)}"]`);
    const orig = allParticipants.find(p => getItemKey(p) === key);
    if (!tr || !orig) return;

    const addr = tr.querySelector('.inp-addr').value.trim();
    const type = tr.querySelector('.inp-type').value;
    const spot = tr.querySelector('.inp-spot').value.trim() || '未定';
    const group = tr.querySelector('.inp-group').value.trim() || '未定';
    const candy = tr.querySelector('.inp-candy').value.trim() || '未定';

    draftEdits[key] = { address: addr, type: type, candySpot: spot, group: group, candy: candy };

    const modified =
      addr !== orig.address ||
      type !== orig.type ||
      spot !== (orig.candySpot || '未定') ||
      group !== (orig.group || '未定') ||
      candy !== (orig.candy || '未定');

    tr.classList.toggle('row-modified', modified);
  }

  function updateEditButtonUI() {
    const btn = document.getElementById('toggleEditBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    const table = document.getElementById('participantsTable');
    const hint = document.getElementById('sheetHintNote');

    if (isEditMode) {
      btn.textContent = '保存する';
      btn.classList.add('saving-mode');
      cancelBtn.style.display = 'inline-block';
      table.classList.add('editing-active');
      hint.textContent = '✏️ 編集中：各セルを書き換えて右上の「保存する」を押してください。';
    } else {
      btn.textContent = '編集';
      btn.classList.remove('saving-mode');
      cancelBtn.style.display = 'none';
      table.classList.remove('editing-active');
      hint.textContent = '※表は左右にスクロールできます。右上の「編集」で全セルを直接編集できます。';
    }
  }

  async function handleSingleEditButton() {
    if (!isEditMode) {
      if (allParticipants.length === 0) return;
      isEditMode = true;
      draftEdits = {};
      allParticipants.forEach(p => {
        draftEdits[getItemKey(p)] = {
          address: p.address,
          type: p.type,
          candySpot: p.candySpot,
          group: p.group,
          candy: p.candy
        };
      });
      updateEditButtonUI();
      renderParticipants();
      return;
    }

    syncDraftInputsToMemory();

    const changedList = [];
    for (let i = 0; i < allParticipants.length; i++) {
      const orig = allParticipants[i];
      const key = getItemKey(orig);
      const d = draftEdits[key];
      if (!d) continue;

      if (!d.address) {
        alert(`元の番地「${orig.address}」の番地が空欄になっています。入力してください。`);
        return;
      }

      const isModified =
        d.address !== orig.address ||
        d.type !== orig.type ||
        (d.candySpot || '未定') !== (orig.candySpot || '未定') ||
        (d.group || '未定') !== (orig.group || '未定') ||
        (d.candy || '未定') !== (orig.candy || '未定');

      if (isModified) {
        changedList.push({ orig: orig, draft: d });
      }
    }

    if (changedList.length === 0) {
      isEditMode = false;
      draftEdits = {};
      updateEditButtonUI();
      renderParticipants();
      showToast('変更はありませんでした。');
      return;
    }

    const btn = document.getElementById('toggleEditBtn');
    const cancelBtn = document.getElementById('cancelEditBtn');
    btn.disabled = true;
    cancelBtn.disabled = true;
    btn.textContent = '保存中...';

    try {
      let latestParticipants = allParticipants;
      for (let i = 0; i < changedList.length; i++) {
        const item = changedList[i];
        const data = await postGas({
          action: 'adminUpdateParticipant',
          passwordHash: cachedHash,
          token: item.orig.token,
          rowNumber: item.orig.rowNumber,
          address: item.draft.address,
          type: item.draft.type,
          candySpot: item.draft.candySpot || '未定',
          group: item.draft.group || '未定',
          candy: item.draft.candy || '未定'
        });

        if (!data || !data.success) {
          alert(`番地「${item.draft.address}」の保存に失敗しました: ${(data && data.message) || 'エラー'}`);
          btn.disabled = false;
          cancelBtn.disabled = false;
          updateEditButtonUI();
          return;
        }
        if (Array.isArray(data.participants)) {
          latestParticipants = data.participants;
        }
      }

      allParticipants = latestParticipants;
      isEditMode = false;
      draftEdits = {};
      btn.disabled = false;
      cancelBtn.disabled = false;
      updateEditButtonUI();
      renderParticipants();
      showToast(`${changedList.length}件のステータスを更新しました。`);
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
      cancelBtn.disabled = false;
      updateEditButtonUI();
    }
  }

  function cancelBulkEdit() {
    isEditMode = false;
    draftEdits = {};
    updateEditButtonUI();
    renderParticipants();
  }

  function formatTypeBadge(typeStr) {
    const t = String(typeStr || '');
    if (t.includes('欠席')) {
      return '<span class="type-badge type-absent">欠席</span>';
    }
    if (t.includes('両方')) {
      return '<span class="type-badge type-both">両方（散策＋スポット協力）</span>';
    }
    if (t.includes('スポット')) {
      return '<span class="type-badge type-spot">スポットのみ</span>';
    }
    if (t.includes('散策')) {
      return '<span class="type-badge type-walk">散策のみ</span>';
    }
    return escapeHtml(t);
  }

  function formatCellVal(val) {
    const v = String(val || '').trim();
    if (!v || v === '未定' || v === '対象外') {
      return `<span class="val-muted">${escapeHtml(v || '未定')}</span>`;
    }
    return escapeHtml(v);
  }

  function renderParticipants() {
    const tbody = document.getElementById('participantsTbody');
    const kw = String(document.getElementById('searchInput').value || '').trim().toLowerCase();

    const list = allParticipants.filter(p => {
      const key = getItemKey(p);
      const cur = (isEditMode && draftEdits[key]) ? draftEdits[key] : p;

      if (currentFilter === 'undecided') {
        if (cur.candySpot !== '未定' && cur.group !== '未定' && cur.candy !== '未定') return false;
      } else if (currentFilter === 'spot') {
        if (!String(cur.type).includes('両方') && !String(cur.type).includes('スポット')) return false;
      } else if (currentFilter === 'absent') {
        if (!String(cur.type).includes('欠席')) return false;
      }

      if (!kw) return true;
      const text = `${cur.address} ${cur.type} ${cur.candySpot} ${cur.group} ${cur.candy}`.toLowerCase();
      return text.includes(kw);
    });

    document.getElementById('countLabel').innerText = `${list.length}/${allParticipants.length}件`;

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#a0aec0;">該当するデータがありません。</td></tr>`;
      return;
    }

    const typeChoices = [
      '両方（散策＋スポット協力）',
      '散策のみ',
      'スポットのみ',
      '欠席'
    ];

    tbody.innerHTML = list.map(p => {
      const key = getItemKey(p);

      if (isEditMode) {
        const cur = draftEdits[key] || p;
        const isModified =
          cur.address !== p.address ||
          cur.type !== p.type ||
          (cur.candySpot || '未定') !== (p.candySpot || '未定') ||
          (cur.group || '未定') !== (p.group || '未定') ||
          (cur.candy || '未定') !== (p.candy || '未定');

        const typeOpts = typeChoices.map(t =>
          `<option value="${escapeHtml(t)}" ${cur.type === t ? 'selected' : ''}>${escapeHtml(t)}</option>`
        ).join('');

        return `
          <tr data-key="${escapeHtml(key)}" class="${isModified ? 'row-modified' : ''}">
            <td class="col-addr">
              <input type="text" class="cell-input w-addr inp-addr" value="${escapeHtml(cur.address)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
            </td>
            <td>
              <select class="cell-select w-type inp-type" onchange="onCellInputChanged('${escapeHtml(key)}')">${typeOpts}</select>
            </td>
            <td>
              <input type="text" class="cell-input w-spot inp-spot" list="groupPresetList" value="${escapeHtml(cur.candySpot)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
            </td>
            <td>
              <input type="text" class="cell-input w-group inp-group" list="groupPresetList" value="${escapeHtml(cur.group)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
            </td>
            <td>
              <input type="text" class="cell-input w-candy inp-candy" list="candyPresetList" value="${escapeHtml(cur.candy)}" oninput="onCellInputChanged('${escapeHtml(key)}')">
            </td>
          </tr>
        `;
      }

      return `
        <tr>
          <td class="col-addr">${escapeHtml(p.address)}</td>
          <td>${formatTypeBadge(p.type)}</td>
          <td>${formatCellVal(p.candySpot)}</td>
          <td>${formatCellVal(p.group)}</td>
          <td>${formatCellVal(p.candy)}</td>
        </tr>
      `;
    }).join('');
  }

  function showToast(text) {
    const box = document.getElementById('toastBox');
    box.innerText = '✅ ' + text;
    box.style.display = 'block';
    setTimeout(() => { box.style.display = 'none'; }, 4500);
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
